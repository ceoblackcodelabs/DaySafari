{% load i18n image_tags %}<article class="card"><a class="card-photo" href="{% url 'destination_detail' destination.id %}" aria-label="{{ destination.name }}">{% if destination.image %}<img src="{{ destination.image|thumb:640 }}" alt="{{ destination.name }}" loading="lazy" decoding="async" width="640" height="440">{% else %}<img src="{% asset 'img/placeholder-destination.jpg' %}" alt="" loading="lazy" width="640" height="440">{% endif %}<span class="tag">{{ destination.category.category }}</span></a>
<div class="card-body"><div class="card-meta"><span>{% icon 'map-pin' 12 %}{{ destination.category.location }}</span></div><h3><a href="{% url 'destination_detail' destination.id %}">{{ destination.name }}</a></h3><div class="card-foot"><div><small>{% trans "Price" %}</small><strong style="font-size:14px">{% trans "On request" %}</strong></div><a class="text-link" href="{% url 'destination_detail' destination.id %}">{% trans "View details" %} {% icon 'arrow-right' 14 %}</a></div></div></article>
