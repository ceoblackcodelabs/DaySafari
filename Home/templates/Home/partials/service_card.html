{% load i18n image_tags service_tags %}<article class="card"><a class="card-photo" href="{{ service|service_url }}" aria-label="{{ service.name }}"><img src="{% if service.image %}{{ service.image|thumb:640 }}{% else %}{% asset service|service_image %}{% endif %}" alt="{{ service.name }}" loading="lazy" decoding="async" width="640" height="440"></a><div class="card-body"><h3><a href="{{ service|service_url }}">{{ service.name }}</a></h3><p>{{ service.description|truncatewords:26 }}</p><div class="card-foot"><a class="text-link" href="{{ service|service_url }}">{% trans "Learn more" %} {% icon 'arrow-right' 14 %}</a></div></div></article>
