<a href="{{ url }}" class="mega-card dropdown-item">
    <span class="mega-img{% if not img %} mega-ph{% endif %}">{% if img %}<img src="{{ img }}" alt="" loading="lazy" width="240" height="150">{% else %}<i class="fa fa-map-marked-alt"></i>{% endif %}</span>
    <span class="mega-title">{{ title }}</span>{% if sub %}<span class="mega-sub">{{ sub }}</span>{% endif %}
</a>
