<!-- Deliberately standalone: does NOT extend Home/base.html and uses no
     static/url template tags, or context-processor-supplied variables.
     This is the page shown when something has already gone wrong, so it
     must not depend on anything that could itself fail. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Server Error</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #1a1a1a;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box { max-width: 480px; padding: 0 20px; }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; color: #f4a13a; }
        p { color: #ccc; }
        a { color: #f4a13a; }
    </style>
</head>
<body>
    <div class="box">
        <h1>500</h1>
        <p>Something went wrong on our end. We're looking into it.</p>
        <p><a href="/">Return to the homepage</a></p>
    </div>
</body>
</html>
