{% load i18n image_tags %}<div class="gallery-grid" style="grid-template-columns:2fr 1fr 1fr">
{% if package.image %}<a href="{{ package.image|thumb:1600 }}" data-lightbox data-title="{{ package.name }}" style="grid-row:span 2;aspect-ratio:auto;min-height:320px"><img src="{{ package.image|thumb:1200 }}" alt="{{ package.name }}" width="1200" height="900" fetchpriority="high" decoding="async"></a>{% endif %}
{% for g in gallery|slice:":8" %}<a href="{{ g.image|thumb:1600 }}" data-lightbox data-title="{{ g.caption|default:package.name }}"><img src="{{ g.image|thumb:640 }}" alt="{{ g.caption|default:package.name }}" loading="lazy" decoding="async" width="640" height="440"></a>{% endfor %}
</div>
